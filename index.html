<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语单词小霸王 - Fun Vocab Kids</title>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Friendly Look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f4f9ff;
        }
        .font-fredoka {
            font-family: 'Fredoka One', cursive;
        }
        .bounce-gentle {
            animation: bounceGentle 2s infinite;
        }
        @keyframes bounceGentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15), 0 8px 10px -6px rgba(59, 130, 246, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
    </style>
</head>
<body class="text-slate-700 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 默认内置的常用儿童单词库（带有 SVG/Icon 标记）
        const INITIAL_WORDS = [
            { id: '1', word: 'apple', translation: '苹果', pos: 'Noun', icon: 'fa-apple-whole', color: 'bg-red-100 text-red-500 border-red-300', customImg: '' },
            { id: '2', word: 'run', translation: '跑步', pos: 'Verb', icon: 'fa-person-running', color: 'bg-blue-100 text-blue-500 border-blue-300', customImg: '' },
            { id: '3', word: 'happy', translation: '快乐的', pos: 'Adjective', icon: 'fa-face-smile-beam', color: 'bg-amber-100 text-amber-500 border-amber-300', customImg: '' },
            { id: '4', word: 'dog', translation: '小狗', pos: 'Noun', icon: 'fa-dog', color: 'bg-orange-100 text-orange-500 border-orange-300', customImg: '' },
            { id: '5', word: 'play basketball', translation: '打篮球', pos: 'Phrase', icon: 'fa-basketball', color: 'bg-purple-100 text-purple-500 border-purple-300', customImg: '' },
            { id: '6', word: 'fast', translation: '快速地', pos: 'Adverb', icon: 'fa-bolt', color: 'bg-yellow-100 text-yellow-600 border-yellow-300', customImg: '' },
            { id: '7', word: 'cat', translation: '小猫', pos: 'Noun', icon: 'fa-cat', color: 'bg-teal-100 text-teal-500 border-teal-300', customImg: '' },
            { id: '8', word: 'swim', translation: '游泳', pos: 'Verb', icon: 'fa-person-swimming', color: 'bg-cyan-100 text-cyan-500 border-cyan-300', customImg: '' }
        ];

        // ===== 云端同步配置 (JSONBin.io) =====
        const CLOUD_CONFIG = {
            binId: '6af682bbffd5d16053bdb29f',
            masterKey: '$2a$10$n6jY496mJKnuDq/O1mqrL.OW5.5N3TdPZ72VT7krZbSuaijYAznZ2'
        };

        // 词性定义与分类标签颜色
        const POS_CONFIG = {
            'All': { name: '全部词性', color: 'bg-slate-200 text-slate-700 hover:bg-slate-300' },
            'Noun': { name: '名词 (Noun)', tagColor: 'bg-rose-500 text-white', lightColor: 'bg-rose-50 text-rose-700 border-rose-200' },
            'Verb': { name: '动词 (Verb)', tagColor: 'bg-sky-500 text-white', lightColor: 'bg-sky-50 text-sky-700 border-sky-200' },
            'Adjective': { name: '形容词 (Adj.)', tagColor: 'bg-amber-500 text-white', lightColor: 'bg-amber-50 text-amber-700 border-amber-200' },
            'Adverb': { name: '副词 (Adv.)', tagColor: 'bg-emerald-500 text-white', lightColor: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
            'Phrase': { name: '短语/词组 (Phrase)', tagColor: 'bg-purple-500 text-white', lightColor: 'bg-purple-50 text-purple-700 border-purple-200' }
        };

        // 年级 / 册 / 单元 配置
        const GRADE_CONFIG = {
            'All': { name: '全部年级' },
            'none': { name: '未分类' },
            '1': { name: '一年级' },
            '2': { name: '二年级' },
            '3': { name: '三年级' },
            '4': { name: '四年级' },
            '5': { name: '五年级' },
            '6': { name: '六年级' }
        };
        const GRADE_NAMES = { '1': '一年级', '2': '二年级', '3': '三年级', '4': '四年级', '5': '五年级', '6': '六年级' };
        const TERM_CONFIG = {
            'All': '全部',
            'none': '未分类',
            '上': '上册',
            '下': '下册'
        };
        const UNIT_MAX = 10;

        // 预设儿童常用图标库已随卡片改版移除（不再使用图标）

        // ===== 云端同步控制（手动模式，节省 API 额度） =====
        function SyncControls({ syncMsg, onPush, onPull }) {
            const busy = syncMsg && syncMsg.type === 'saving';
            const btnBase = "px-4 py-2 rounded-2xl text-xs md:text-sm font-bold shadow-md flex items-center justify-center gap-2 transition whitespace-nowrap border-2 active:scale-95";
            const msgColor = !syncMsg ? '' : syncMsg.type === 'ok'
                ? 'text-emerald-100'
                : syncMsg.type === 'error' ? 'text-rose-100' : 'text-white/80';
            return (
                <div className="flex flex-col items-stretch gap-1.5">
                    <button
                        onClick={onPush}
                        disabled={busy}
                        title="把当前设备上的词库上传到云端"
                        className={`${btnBase} bg-white text-indigo-600 border-indigo-200 hover:bg-yellow-100 ${busy ? 'opacity-60' : ''}`}
                    >
                        <i className="fa-solid fa-cloud-arrow-up"></i>
                        <span>上传云端</span>
                    </button>
                    <button
                        onClick={onPull}
                        disabled={busy}
                        title="从云端拉取最新词库，并保存到本设备的 localStorage"
                        className={`${btnBase} bg-indigo-500/90 text-white border-white/40 hover:bg-indigo-600 ${busy ? 'opacity-60' : ''}`}
                    >
                        <i className="fa-solid fa-cloud-arrow-down"></i>
                        <span>导入到本地</span>
                    </button>
                    {syncMsg && (
                        <span className={`text-xs font-bold text-center ${msgColor}`}>
                            {busy && <i className="fa-solid fa-spinner fa-spin mr-1"></i>}
                            {syncMsg.text}
                        </span>
                    )}
                </div>
            );
        }

        function App() {
            // State
            const [words, setWords] = useState(() => {
                const saved = localStorage.getItem('kids_vocab_data');
                return saved ? JSON.parse(saved) : INITIAL_WORDS;
            });
            const [currentTab, setCurrentTab] = useState('list'); // 'list', 'recite', 'quiz'
            const [selectedPos, setSelectedPos] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [gradeFilter, setGradeFilter] = useState('All');
            const [termFilter, setTermFilter] = useState('All');
            const [unitFilter, setUnitFilter] = useState('All');
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            // syncMsg: null | { type: 'saving' | 'ok' | 'error', text: '...' }
            const [syncMsg, setSyncMsg] = useState(null);

            // localStorage 永远实时保存（免费、不占云端额度）
            useEffect(() => {
                localStorage.setItem('kids_vocab_data', JSON.stringify(words));
            }, [words]);

            // 手动上传：把当前词库推送到云端
            const pushToCloud = async () => {
                setSyncMsg({ type: 'saving', text: '正在上传…' });
                try {
                    const res = await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_CONFIG.binId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': CLOUD_CONFIG.masterKey
                        },
                        body: JSON.stringify({ words: words })
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    setSyncMsg({ type: 'ok', text: '已上传到云端 ✓' });
                } catch (err) {
                    console.error('云端上传失败:', err);
                    setSyncMsg({ type: 'error', text: '上传失败，请重试' });
                }
            };

            // 手动导入：从云端拉取最新词库，并写入 localStorage
            const pullFromCloud = async () => {
                setSyncMsg({ type: 'saving', text: '正在导入…' });
                try {
                    const res = await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_CONFIG.binId}/latest`, {
                        headers: { 'X-Master-Key': CLOUD_CONFIG.masterKey }
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const json = await res.json();
                    const record = json.record;
                    const arr = Array.isArray(record) ? record : (record && record.words);
                    if (Array.isArray(arr)) {
                        setWords(arr);
                        setSyncMsg({ type: 'ok', text: `已导入 ${arr.length} 个单词到本地 ✓` });
                    } else {
                        setSyncMsg({ type: 'error', text: '云端数据格式异常' });
                    }
                } catch (err) {
                    console.error('云端导入失败:', err);
                    setSyncMsg({ type: 'error', text: '导入失败，请重试' });
                }
            };

            // 添加新单词
            const handleAddWord = (newWordObj) => {
                setWords(prev => [newWordObj, ...prev]);
                setIsAddModalOpen(false);
            };

            // 删除单词
            const handleDeleteWord = (id) => {
                if(window.confirm('确定要删除这个单词吗？')) {
                    setWords(prev => prev.filter(w => w.id !== id));
                }
            };

            // 过滤单词列表
            const filteredWords = useMemo(() => {
                return words.filter(w => {
                    const matchesPos = selectedPos === 'All' || w.pos === selectedPos;
                    const matchesGrade = gradeFilter === 'All'
                        ? true
                        : gradeFilter === 'none' ? !w.grade : w.grade === gradeFilter;
                    const matchesTerm = termFilter === 'All'
                        ? true
                        : termFilter === 'none' ? !w.term : w.term === termFilter;
                    const matchesUnit = unitFilter === 'All'
                        ? true
                        : unitFilter === 'none' ? !w.unit : String(w.unit) === String(unitFilter);
                    const matchesSearch = w.word.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                          (w.translation && w.translation.includes(searchQuery));
                    return matchesPos && matchesGrade && matchesTerm && matchesUnit && matchesSearch;
                });
            }, [words, selectedPos, gradeFilter, termFilter, unitFilter, searchQuery]);

            return (
                <div className="max-w-6xl mx-auto px-4 py-6">
                    {/* Header Banner */}
                    <header className="bg-gradient-to-r from-yellow-400 via-pink-400 to-indigo-400 rounded-3xl p-6 mb-8 text-white shadow-xl relative overflow-hidden flex flex-col md:flex-row items-center justify-between">
                        <div className="z-10 text-center md:text-left mb-4 md:mb-0">
                            <div className="flex items-center justify-center md:justify-start gap-3">
                                <i className="fa-solid fa-graduation-cap text-4xl text-yellow-200 bounce-gentle"></i>
                                <h1 className="text-3xl md:text-4xl font-fredoka tracking-wide">英语单词小霸王</h1>
                            </div>
                            <p className="text-white/90 text-sm md:text-base font-semibold mt-1">
                                轻松积攒词汇，默写背单词，开心做大闯关！
                            </p>
                        </div>

                        {/* Top Controls */}
                        <div className="z-10 flex items-center gap-3">
                            <SyncControls syncMsg={syncMsg} onPush={pushToCloud} onPull={pullFromCloud} />
                            <button
                                onClick={() => setIsAddModalOpen(true)}
                                className="bg-white text-indigo-600 hover:bg-yellow-100 font-bold px-5 py-3 rounded-2xl shadow-lg transition transform active:scale-95 flex items-center gap-2 border-2 border-indigo-200"
                            >
                                <i className="fa-solid fa-plus-circle text-xl text-yellow-500"></i>
                                <span>添加新单词</span>
                            </button>
                        </div>
                        
                        {/* Decorative Background Circles */}
                        <div className="absolute -right-10 -bottom-10 w-40 h-40 bg-white/20 rounded-full blur-xl pointer-events-none"></div>
                        <div className="absolute left-1/3 -top-10 w-32 h-32 bg-yellow-300/30 rounded-full blur-lg pointer-events-none"></div>
                    </header>

                    {/* Main Navigation Tabs */}
                    <nav className="flex justify-center mb-8 gap-3 md:gap-6">
                        <button
                            onClick={() => setCurrentTab('list')}
                            className={`flex items-center gap-2 px-6 py-3 rounded-2xl font-bold text-lg transition-all shadow-sm ${
                                currentTab === 'list' 
                                ? 'bg-indigo-600 text-white shadow-indigo-200 scale-105' 
                                : 'bg-white text-slate-600 hover:bg-indigo-50 border border-slate-200'
                            }`}
                        >
                            <i className="fa-solid fa-book-open"></i>
                            <span>单词宝库 ({words.length})</span>
                        </button>

                        <button
                            onClick={() => setCurrentTab('recite')}
                            className={`flex items-center gap-2 px-6 py-3 rounded-2xl font-bold text-lg transition-all shadow-sm ${
                                currentTab === 'recite' 
                                ? 'bg-pink-500 text-white shadow-pink-200 scale-105' 
                                : 'bg-white text-slate-600 hover:bg-pink-50 border border-slate-200'
                            }`}
                        >
                            <i className="fa-solid fa-brain"></i>
                            <span>默写练习</span>
                        </button>

                        <button
                            onClick={() => setCurrentTab('quiz')}
                            className={`flex items-center gap-2 px-6 py-3 rounded-2xl font-bold text-lg transition-all shadow-sm ${
                                currentTab === 'quiz' 
                                ? 'bg-amber-500 text-white shadow-amber-200 scale-105' 
                                : 'bg-white text-slate-600 hover:bg-amber-50 border border-slate-200'
                            }`}
                        >
                            <i className="fa-solid fa-trophy"></i>
                            <span>闯关测试</span>
                        </button>
                    </nav>

                    {/* View Switcher */}
                    <main>
                        {currentTab === 'list' && (
                            <WordListView
                                words={filteredWords}
                                totalWordsCount={words.length}
                                selectedPos={selectedPos}
                                setSelectedPos={setSelectedPos}
                                searchQuery={searchQuery}
                                setSearchQuery={setSearchQuery}
                                gradeFilter={gradeFilter}
                                setGradeFilter={setGradeFilter}
                                termFilter={termFilter}
                                setTermFilter={setTermFilter}
                                unitFilter={unitFilter}
                                setUnitFilter={setUnitFilter}
                                onDeleteWord={handleDeleteWord}
                                onOpenAddModal={() => setIsAddModalOpen(true)}
                            />
                        )}

                        {currentTab === 'recite' && (
                            <ReciteView words={words} />
                        )}

                        {currentTab === 'quiz' && (
                            <QuizView words={words} />
                        )}
                    </main>

                    {/* Add Word Modal */}
                    {isAddModalOpen && (
                        <AddWordModal 
                            onClose={() => setIsAddModalOpen(false)}
                            onAdd={handleAddWord}
                        />
                    )}
                </div>
            );
        }

        // =====================================
        // Component 1: Word List View & Filtering
        // =====================================
        function WordListView({ words, totalWordsCount, selectedPos, setSelectedPos, searchQuery, setSearchQuery, gradeFilter, setGradeFilter, termFilter, setTermFilter, unitFilter, setUnitFilter, onDeleteWord, onOpenAddModal }) {
            const selectCls = "px-3 py-2 rounded-xl border border-slate-200 font-bold text-sm bg-white text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-400 cursor-pointer";
            const hasGradeFilter = gradeFilter !== 'All' || termFilter !== 'All' || unitFilter !== 'All';
            const resetGradeFilters = () => { setGradeFilter('All'); setTermFilter('All'); setUnitFilter('All'); };

            return (
                <div className="space-y-6">
                    {/* Grade / Term / Unit Filter Bar */}
                    <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-wrap items-center gap-2">
                        <span className="text-sm font-bold text-slate-400 mr-1">按年级单元:</span>
                        <select
                            value={gradeFilter}
                            onChange={(e) => setGradeFilter(e.target.value)}
                            className={selectCls}
                        >
                            {Object.keys(GRADE_CONFIG).map(key => (
                                <option key={key} value={key}>{GRADE_CONFIG[key].name}</option>
                            ))}
                        </select>
                        <select
                            value={termFilter}
                            onChange={(e) => setTermFilter(e.target.value)}
                            className={selectCls}
                        >
                            {Object.keys(TERM_CONFIG).map(key => (
                                <option key={key} value={key}>{TERM_CONFIG[key]}</option>
                            ))}
                        </select>
                        <select
                            value={unitFilter}
                            onChange={(e) => setUnitFilter(e.target.value)}
                            className={selectCls}
                        >
                            <option value="All">全部单元</option>
                            <option value="none">未分单元</option>
                            {Array.from({ length: UNIT_MAX }, (_, i) => i + 1).map(n => (
                                <option key={n} value={n}>Unit {n}</option>
                            ))}
                        </select>
                        {hasGradeFilter && (
                            <button
                                onClick={resetGradeFilters}
                                className="px-3 py-2 rounded-xl font-bold text-sm bg-rose-50 text-rose-500 hover:bg-rose-100 transition"
                            >
                                <i className="fa-solid fa-rotate-left mr-1"></i>
                                重置
                            </button>
                        )}
                    </div>

                    {/* Search & POS Filter Bar */}
                    <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4 md:space-y-0 md:flex md:items-center md:justify-between gap-4">
                        {/* POS Filter Buttons */}
                        <div className="flex flex-wrap gap-2 items-center">
                            <span className="text-sm font-bold text-slate-400 mr-1">按词性筛选:</span>
                            {Object.keys(POS_CONFIG).map(posKey => (
                                <button
                                    key={posKey}
                                    onClick={() => setSelectedPos(posKey)}
                                    className={`px-3 py-1.5 rounded-xl font-bold text-sm transition ${
                                        selectedPos === posKey 
                                        ? 'bg-indigo-600 text-white shadow-md' 
                                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                    }`}
                                >
                                    {POS_CONFIG[posKey].name}
                                </button>
                            ))}
                        </div>

                        {/* Search Input */}
                        <div className="relative min-w-[240px]">
                            <i className="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input
                                type="text"
                                placeholder="搜索英文或中文..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                className="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 text-sm font-semibold"
                            />
                            {searchQuery && (
                                <button 
                                    onClick={() => setSearchQuery('')}
                                    className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Word Cards Grid */}
                    {words.length > 0 ? (
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            {words.map(item => (
                                <WordCard key={item.id} item={item} onDelete={onDeleteWord} />
                            ))}
                        </div>
                    ) : (
                        <div className="bg-white rounded-3xl p-12 text-center border-2 border-dashed border-slate-200 space-y-4">
                            <div className="w-20 h-20 mx-auto bg-indigo-50 text-indigo-400 rounded-full flex items-center justify-center text-3xl">
                                <i className="fa-solid fa-box-open"></i>
                            </div>
                            <h3 className="text-xl font-bold text-slate-600">没有找到相关单词哦</h3>
                            <p className="text-slate-400 text-sm max-w-sm mx-auto">
                                {totalWordsCount === 0 ? "快点击上方按钮添加你的第一个单词吧！" : "尝试更换搜索词或选择其他的词性标签。"}
                            </p>
                            {totalWordsCount === 0 && (
                                <button
                                    onClick={onOpenAddModal}
                                    className="px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-bold shadow-md hover:bg-indigo-700 transition"
                                >
                                    去添加单词
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // Single Word Card Component
        function WordCard({ item, onDelete }) {
            const [speaking, setSpeaking] = useState(false);

            // 朗读单词发音
            const playPronunciation = (e) => {
                e.stopPropagation();
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(item.word);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.85; // 稍微放慢发音速度便于孩子听清
                    utterance.onstart = () => setSpeaking(true);
                    utterance.onend = () => setSpeaking(false);
                    utterance.onerror = () => setSpeaking(false);
                    window.speechSynthesis.speak(utterance);
                }
            };

            const posInfo = POS_CONFIG[item.pos] || POS_CONFIG['Noun'];

            // 年级/册/单元 标签文字
            const classParts = [];
            if (item.grade) classParts.push(GRADE_NAMES[item.grade] || item.grade);
            if (item.term) classParts.push(item.term + '册');
            if (item.unit) classParts.push('Unit ' + item.unit);
            const classLabel = classParts.length > 0 ? classParts.join(' · ') : '未分类';

            return (
                <div className="bg-white rounded-2xl p-4 pt-3 card-shadow border border-slate-100 relative group hover:-translate-y-1 hover:shadow-xl transition duration-200 flex flex-col">
                    {/* Top POS Tag & Delete Button */}
                    <div className="flex justify-between items-center mb-2">
                        <span className={`text-xs px-2 py-0.5 rounded-md font-bold ${posInfo.tagColor}`}>
                            {item.pos}
                        </span>
                        <button
                            onClick={() => onDelete(item.id)}
                            className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition px-1.5 py-0.5"
                            title="删除单词"
                        >
                            <i className="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>

                    {/* English Word */}
                    <div className="flex items-center justify-center gap-2 min-h-[40px]">
                        <h2 className="text-xl md:text-2xl font-fredoka text-slate-800 tracking-wide text-center leading-tight break-words">
                            {item.word}
                        </h2>
                        <button
                            onClick={playPronunciation}
                            className={`shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm transition ${
                                speaking ? 'bg-amber-400 text-white animate-pulse' : 'bg-indigo-50 text-indigo-500 hover:bg-indigo-100'
                            }`}
                            title="听发音"
                        >
                            <i className="fa-solid fa-volume-high"></i>
                        </button>
                    </div>

                    {/* Bottom Info: Chinese meaning + classification */}
                    <div className="mt-auto pt-2 border-t border-dashed border-slate-100 space-y-1 text-center">
                        {item.translation && (
                            <p className="text-slate-500 font-bold text-sm">{item.translation}</p>
                        )}
                        <p className={`text-xs font-bold ${classParts.length > 0 ? 'text-indigo-400' : 'text-slate-300'}`}>

        // =====================================
        // Shared: 年级/册别/单元 范围筛选条（默写 & 闯关共用）
        // =====================================
        function RangeFilterBar({ gradeFilter, setGradeFilter, termFilter, setTermFilter, unitFilter, setUnitFilter, count, label, accent }) {
            const selectCls = `px-3 py-2 rounded-xl border border-slate-200 font-bold text-sm bg-white text-slate-600 focus:outline-none focus:ring-2 ${accent === 'amber' ? 'focus:ring-amber-400' : 'focus:ring-indigo-400'} cursor-pointer`;
            const hasFilter = gradeFilter !== 'All' || termFilter !== 'All' || unitFilter !== 'All';
            const reset = () => { setGradeFilter('All'); setTermFilter('All'); setUnitFilter('All'); };
            return (
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex flex-wrap items-center gap-2">
                    <span className="text-sm font-bold text-slate-400 mr-1">
                        <i className={`fa-solid fa-filter mr-1 ${accent === 'amber' ? 'text-amber-400' : 'text-indigo-400'}`}></i>
                        {label}:
                    </span>
                    <select value={gradeFilter} onChange={(e) => setGradeFilter(e.target.value)} className={selectCls}>
                        {Object.keys(GRADE_CONFIG).map(key => (
                            <option key={key} value={key}>{GRADE_CONFIG[key].name}</option>
                        ))}
                    </select>
                    <select value={termFilter} onChange={(e) => setTermFilter(e.target.value)} className={selectCls}>
                        {Object.keys(TERM_CONFIG).map(key => (
                            <option key={key} value={key}>{TERM_CONFIG[key]}</option>
                        ))}
                    </select>
                    <select value={unitFilter} onChange={(e) => setUnitFilter(e.target.value)} className={selectCls}>
                        <option value="All">全部单元</option>
                        <option value="none">未分单元</option>
                        {Array.from({ length: UNIT_MAX }, (_, i) => i + 1).map(n => (
                            <option key={n} value={n}>Unit {n}</option>
                        ))}
                    </select>
                    {hasFilter && (
                        <button
                            onClick={reset}
                            className="px-3 py-2 rounded-xl font-bold text-sm bg-rose-50 text-rose-500 hover:bg-rose-100 transition"
                        >
                            <i className="fa-solid fa-rotate-left mr-1"></i>
                            重置
                        </button>
                    )}
                    <span className="ml-auto text-xs font-bold text-slate-400 bg-slate-50 px-2.5 py-1 rounded-lg">
                        范围内 {count} 个单词
                    </span>
                </div>
            );
        }

        // =====================================
        // Component 2: Recite Mode (看中文默写)
        // =====================================
        function ReciteView({ words }) {
            const [gradeFilter, setGradeFilter] = useState('All');
            const [termFilter, setTermFilter] = useState('All');
            const [unitFilter, setUnitFilter] = useState('All');
            const [currentIndex, setCurrentIndex] = useState(0);
            const [userInput, setUserInput] = useState('');
            const [feedback, setFeedback] = useState(null); // 'correct', 'wrong', null
            const [showHint, setShowHint] = useState(false);

            // 按年级/册别/单元筛选出默写范围的单词
            const poolWords = useMemo(() => {
                return words.filter(w => {
                    const matchesGrade = gradeFilter === 'All'
                        ? true
                        : gradeFilter === 'none' ? !w.grade : w.grade === gradeFilter;
                    const matchesTerm = termFilter === 'All'
                        ? true
                        : termFilter === 'none' ? !w.term : w.term === termFilter;
                    const matchesUnit = unitFilter === 'All'
                        ? true
                        : unitFilter === 'none' ? !w.unit : String(w.unit) === String(unitFilter);
                    return matchesGrade && matchesTerm && matchesUnit;
                });
            }, [words, gradeFilter, termFilter, unitFilter]);

            // 范围变化时回到第一个单词并清空输入
            useEffect(() => {
                setCurrentIndex(0);
                setUserInput('');
                setShowHint(false);
                setFeedback(null);
            }, [poolWords]);

            const filterBar = (
                <RangeFilterBar
                    gradeFilter={gradeFilter} setGradeFilter={setGradeFilter}
                    termFilter={termFilter} setTermFilter={setTermFilter}
                    unitFilter={unitFilter} setUnitFilter={setUnitFilter}
                    count={poolWords.length}
                    label="默写范围"
                    accent="indigo"
                />
            );

            if (!poolWords || poolWords.length === 0) {
                return (
                    <div className="space-y-4">
                        {filterBar}
                        <div className="bg-white rounded-3xl p-12 text-center border-2 border-dashed border-slate-200">
                            <p className="text-lg font-bold text-slate-500">
                                {words.length === 0
                                    ? '请先在单词库中添加一些单词，再来进行默写练习吧！'
                                    : '当前筛选范围内没有单词，调整一下筛选范围或去添加单词吧！'}
                            </p>
                        </div>
                    </div>
                );
            }

            const current = poolWords[currentIndex % poolWords.length];

            const handleCheck = (e) => {
                e.preventDefault();
                if (!userInput.trim()) return;

                const cleanInput = userInput.trim().toLowerCase();
                const cleanTarget = current.word.trim().toLowerCase();

                if (cleanInput === cleanTarget) {
                    setFeedback('correct');
                    // 朗读发音作为奖励
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(current.word);
                        utterance.lang = 'en-US';
                        window.speechSynthesis.speak(utterance);
                    }
                } else {
                    setFeedback('wrong');
                }
            };

            const handleNext = () => {
                setFeedback(null);
                setUserInput('');
                setShowHint(false);
                setCurrentIndex(prev => prev + 1);
            };

            return (
                <div className="space-y-4">
                    {filterBar}
                    <div className="max-w-xl mx-auto bg-white rounded-3xl p-8 card-shadow border border-slate-100 text-center space-y-6">
                    {/* Header Status */}
                    <div className="flex justify-between items-center text-sm font-bold text-slate-400">
                        <span>看中文 默写单词模式</span>
                        <span>{currentIndex + 1} / {poolWords.length}</span>
                    </div>

                    {/* Prompt Card: 中文意思居中显示 */}
                    <div className="w-56 h-56 md:w-64 md:h-64 mx-auto bg-gradient-to-b from-indigo-50 to-indigo-100/50 rounded-3xl flex items-center justify-center border-4 border-indigo-100 shadow-inner relative px-6">
                        {/* POS Tag Badge */}
                        <div className="absolute top-3 right-3 bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-full font-bold shadow-md">
                            {current.pos}
                        </div>
                        <p className="text-3xl md:text-4xl font-fredoka text-indigo-900 text-center leading-snug break-words">
                            {current.translation || '未设置中文释义'}
                        </p>
                    </div>

                    {/* Hint Section */}
                    <div>
                        {showHint && (
                            <p className="text-amber-500 font-bold mt-2 text-sm bg-amber-50 inline-block px-3 py-1 rounded-xl">
                                首字母提示: <span className="font-fredoka text-base">{current.word.charAt(0)}...</span> (共 {current.word.length} 个字母)
                            </p>
                        )}
                    </div>

                    {/* Input Form */}
                    <form onSubmit={handleCheck} className="space-y-4">
                        <div className="relative max-w-sm mx-auto">
                            <input
                                type="text"
                                autoFocus
                                value={userInput}
                                onChange={(e) => {
                                    setUserInput(e.target.value);
                                    if(feedback) setFeedback(null);
                                }}
                                disabled={feedback === 'correct'}
                                placeholder="输入英文拼写..."
                                className={`w-full text-center text-2xl font-fredoka py-3 px-4 rounded-2xl border-4 transition focus:outline-none ${
                                    feedback === 'correct' 
                                    ? 'border-emerald-400 bg-emerald-50 text-emerald-700' 
                                    : feedback === 'wrong'
                                    ? 'border-rose-400 bg-rose-50 text-rose-700 animate-shake'
                                    : 'border-indigo-200 focus:border-indigo-500'
                                }`}
                            />
                        </div>

                        {/* Feedback Banner */}
                        {feedback === 'correct' && (
                            <div className="bg-emerald-100 text-emerald-700 p-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                                <i className="fa-solid fa-circle-check text-2xl text-emerald-500"></i>
                                <span>太棒了！拼写完全正确！ 🎉</span>
                            </div>
                        )}

                        {feedback === 'wrong' && (
                            <div className="bg-rose-100 text-rose-700 p-3 rounded-2xl font-bold flex items-center justify-center gap-2">
                                <i className="fa-solid fa-circle-xmark text-xl text-rose-500"></i>
                                <span>再想一想哦，加油！💪</span>
                            </div>
                        )}

                        {/* Action Buttons */}
                        <div className="flex justify-center gap-3 pt-2">
                            {!showHint && feedback !== 'correct' && (
                                <button
                                    type="button"
                                    onClick={() => setShowHint(true)}
                                    className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold text-sm hover:bg-slate-200"
                                >
                                    <i className="fa-solid fa-lightbulb text-amber-400 mr-1"></i>
                                    需要提示
                                </button>
                            )}

                            {feedback !== 'correct' ? (
                                <button
                                    type="submit"
                                    className="px-8 py-3 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition"
                                >
                                    提交检查
                                </button>
                            ) : (
                                <button
                                    type="button"
                                    onClick={handleNext}
                                    className="px-8 py-3 bg-emerald-500 text-white rounded-2xl font-bold shadow-lg hover:bg-emerald-600 transition flex items-center gap-2"
                                >
                                    <span>下一个单词</span>
                                    <i className="fa-solid fa-arrow-right"></i>
                                </button>
                            )}
                        </div>
                    </form>
                    </div>
                </div>
            );
        }

        // =====================================
        // Component 3: Quiz Mode (闯关测试)
        // =====================================
        function QuizView({ words }) {
            const [gradeFilter, setGradeFilter] = useState('All');
            const [termFilter, setTermFilter] = useState('All');
            const [unitFilter, setUnitFilter] = useState('All');
            const [quizList, setQuizList] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isFinished, setIsFinished] = useState(false);

            // 按年级/册别/单元筛选出测试范围的单词
            const poolWords = useMemo(() => {
                return words.filter(w => {
                    const matchesGrade = gradeFilter === 'All'
                        ? true
                        : gradeFilter === 'none' ? !w.grade : w.grade === gradeFilter;
                    const matchesTerm = termFilter === 'All'
                        ? true
                        : termFilter === 'none' ? !w.term : w.term === termFilter;
                    const matchesUnit = unitFilter === 'All'
                        ? true
                        : unitFilter === 'none' ? !w.unit : String(w.unit) === String(unitFilter);
                    return matchesGrade && matchesTerm && matchesUnit;
                });
            }, [words, gradeFilter, termFilter, unitFilter]);

            // 范围变化时自动重新生成题目
            useEffect(() => {
                if (poolWords && poolWords.length >= 2) {
                    generateQuiz();
                } else {
                    setQuizList([]);
                }
            }, [poolWords]);

            const generateQuiz = () => {
                // 随机打乱筛选后的单词列表
                const shuffled = [...poolWords].sort(() => 0.5 - Math.random());
                const questions = shuffled.map((target) => {
                    // 生成错误选项
                    const otherOptions = poolWords
                        .filter(w => w.id !== target.id)
                        .sort(() => 0.5 - Math.random())
                        .slice(0, 3)
                        .map(w => w.translation);

                    const options = [...otherOptions, target.translation].sort(() => 0.5 - Math.random());
                    return { target, options };
                });

                setQuizList(questions);
                setCurrentIndex(0);
                setScore(0);
                setSelectedOption(null);
                setIsFinished(false);
            };

            // 测试范围筛选条（与默写共用组件）
            const filterBar = (
                <RangeFilterBar
                    gradeFilter={gradeFilter} setGradeFilter={setGradeFilter}
                    termFilter={termFilter} setTermFilter={setTermFilter}
                    unitFilter={unitFilter} setUnitFilter={setUnitFilter}
                    count={poolWords.length}
                    label="测试范围"
                    accent="amber"
                />
            );

            if (!words || words.length < 2) {
                return (
                    <div className="space-y-4">
                        {filterBar}
                        <div className="bg-white rounded-3xl p-12 text-center border-2 border-dashed border-slate-200">
                            <p className="text-lg font-bold text-slate-500">测试需要至少添加 2 个单词哦！快去添加吧~</p>
                        </div>
                    </div>
                );
            }

            if (isFinished) {
                const total = quizList.length;
                const percentage = Math.round((score / total) * 100);

                return (
                    <div className="space-y-4">
                        {filterBar}
                        <div className="max-w-md mx-auto bg-white rounded-3xl p-8 card-shadow border border-slate-100 text-center space-y-6">
                        <div className="w-24 h-24 mx-auto bg-amber-100 text-amber-500 rounded-full flex items-center justify-center text-5xl">
                            <i className="fa-solid fa-trophy animate-bounce"></i>
                        </div>
                        <h2 className="text-3xl font-fredoka text-slate-800">测试完成！</h2>
                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                            <p className="text-slate-500 font-bold text-sm">本次成绩</p>
                            <p className="text-4xl font-fredoka text-indigo-600 mt-1">{score} / {total}</p>
                            <p className="text-xs font-bold text-amber-500 mt-1">正确率：{percentage}%</p>
                        </div>
                        <button
                            onClick={generateQuiz}
                            className="w-full py-3 bg-amber-500 text-white rounded-2xl font-bold text-lg shadow-lg hover:bg-amber-600 transition"
                        >
                            再测一次 🚀
                        </button>
                        </div>
                    </div>
                );
            }

            if (quizList.length === 0) {
                return (
                    <div className="space-y-4">
                        {filterBar}
                        <div className="bg-white rounded-3xl p-10 text-center border-2 border-dashed border-slate-200">
                            <p className="text-lg font-bold text-slate-500">
                                当前筛选范围内只有 {poolWords.length} 个单词，至少需要 2 个才能开始测试哦
                            </p>
                        </div>
                    </div>
                );
            }

            const currentQ = quizList[currentIndex];

            const handleOptionClick = (option) => {
                if (selectedOption !== null) return; // 防止重复点击
                setSelectedOption(option);

                const isCorrect = option === currentQ.target.translation;
                if (isCorrect) setScore(prev => prev + 1);

                setTimeout(() => {
                    if (currentIndex + 1 < quizList.length) {
                        setCurrentIndex(prev => prev + 1);
                        setSelectedOption(null);
                    } else {
                        setIsFinished(true);
                    }
                }, 1200);
            };

            return (
                <div className="space-y-4">
                    {filterBar}
                    <div className="max-w-xl mx-auto bg-white rounded-3xl p-8 card-shadow border border-slate-100 space-y-6">
                    {/* Header Status */}
                    <div className="flex justify-between items-center text-sm font-bold text-slate-400">
                        <span>关卡测试模式</span>
                        <span>题目 {currentIndex + 1} / {quizList.length}</span>
                    </div>

                    {/* Question Card */}
                    <div className="text-center py-6 bg-indigo-50 rounded-2xl border border-indigo-100 space-y-2">
                        <span className="text-xs px-3 py-1 bg-indigo-200 text-indigo-700 rounded-full font-bold">
                            {currentQ.target.pos}
                        </span>
                        <h2 className="text-4xl font-fredoka text-indigo-900 tracking-wider">
                            {currentQ.target.word}
                        </h2>
                        <p className="text-xs text-slate-400 font-bold">请选择正确的中文意思：</p>
                    </div>

                    {/* Options Grid */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {currentQ.options.map((opt, idx) => {
                            let btnStyle = "bg-slate-50 text-slate-700 border-slate-200 hover:bg-indigo-50 hover:border-indigo-300";
                            if (selectedOption !== null) {
                                if (opt === currentQ.target.translation) {
                                    btnStyle = "bg-emerald-500 text-white border-emerald-500 scale-102 shadow-lg";
                                } else if (opt === selectedOption) {
                                    btnStyle = "bg-rose-500 text-white border-rose-500";
                                } else {
                                    btnStyle = "bg-slate-100 text-slate-300 border-slate-100";
                                }
                            }

                            return (
                                <button
                                    key={idx}
                                    onClick={() => handleOptionClick(opt)}
                                    disabled={selectedOption !== null}
                                    className={`p-4 rounded-2xl border-2 font-bold text-base transition-all text-left flex items-center justify-between ${btnStyle}`}
                                >
                                    <span>{opt}</span>
                                    {selectedOption !== null && opt === currentQ.target.translation && (
                                        <i className="fa-solid fa-circle-check text-xl"></i>
                                    )}
                                </button>
                            );
                        })}
                    </div>
                    </div>
                </div>
            );
        }

        // =====================================
        // Component 4: Add Word Modal
        // =====================================

                            <div className="flex justify-end gap-3 pt-3">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="px-5 py-2.5 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200"
                                >
                                    取消
                                </button>
                                <button
                                    type="submit"
                                    className="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-bold shadow-md hover:bg-indigo-700"
                                >
                                    保存单词
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // Render React App
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
